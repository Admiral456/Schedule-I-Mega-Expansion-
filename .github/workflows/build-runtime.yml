name: Build Harborline runtime mod
# Build against the same native S1API and IL2CPP branch used by the shipped mod.

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "src/**"
      - ".github/workflows/build-runtime.yml"
      - "manifest.json"
      - "README.md"
      - "LICENSE"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build-runtime.yml"
  workflow_dispatch:

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - name: Download the matching S1API IL2CPP assembly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s1api"
          curl --fail --location --retry 3 \
            "https://thunderstore.io/package/download/ifBars/S1API_Forked/3.2.2/" \
            --output "$RUNNER_TEMP/s1api-forked.zip"
          unzip -q "$RUNNER_TEMP/s1api-forked.zip" -d "$RUNNER_TEMP/s1api-package"
          S1API_DLL="$(find "$RUNNER_TEMP/s1api-package" -type f -name 'S1API.Il2Cpp.MelonLoader.dll' -print -quit)"
          test -n "$S1API_DLL"
          cp "$S1API_DLL" "$RUNNER_TEMP/s1api/S1API.Il2Cpp.MelonLoader.dll"
      - name: Restore
        run: dotnet restore src/ScheduleIMegaExpansion.csproj -p:S1APIDllPath="$RUNNER_TEMP/s1api/S1API.Il2Cpp.MelonLoader.dll"
      - name: Build
        run: dotnet build src/ScheduleIMegaExpansion.csproj --configuration Release --no-restore -p:S1APIDllPath="$RUNNER_TEMP/s1api/S1API.Il2Cpp.MelonLoader.dll"
      - name: Assemble Thunderstore package
        run: |
          mkdir -p package/Mods
          cp src/bin/Release/net6.0/ScheduleIMegaExpansion.dll package/Mods/
          cp manifest.json package/
          cp README.md package/
          cp LICENSE package/
          (cd package && zip -r ../ScheduleIMegaExpansion-0.3.0.zip .)
          unzip -Z1 ScheduleIMegaExpansion-0.3.0.zip > package-contents.txt
          grep -Fxq "Mods/ScheduleIMegaExpansion.dll" package-contents.txt
          grep -Fxq "manifest.json" package-contents.txt
          grep -Fxq "README.md" package-contents.txt
          grep -Fxq "LICENSE" package-contents.txt
      - name: Upload installable mod package
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleIMegaExpansion-0.3.0
          path: ScheduleIMegaExpansion-0.3.0.zip
          if-no-files-found: error