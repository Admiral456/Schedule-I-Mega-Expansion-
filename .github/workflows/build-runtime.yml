name: Build Harborline runtime mod
# Compile the physical Harborline prototype and native registry survey.

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "src/**"
      - ".github/workflows/build-runtime.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build-runtime.yml"
  workflow_dispatch:

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - name: Restore
        run: dotnet restore src/ScheduleIMegaExpansion.csproj
      - name: Build
        run: dotnet build src/ScheduleIMegaExpansion.csproj --configuration Release --no-restore
      - name: Prepare Harborline mod artifact
        run: |
          mkdir -p artifact
          cp src/bin/Release/net6.0/ScheduleIMegaExpansion.dll artifact/
          cp src/README.md artifact/README.txt
      - name: Upload Harborline mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleIMegaExpansion-harborline-prototype
          path: artifact/*
          if-no-files-found: error
