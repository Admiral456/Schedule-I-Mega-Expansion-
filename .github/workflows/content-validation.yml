name: Harborline content validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Harborline content contracts
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_harborline_data.py
