name: Validate project data

on:
  push:
    branches: ["main", "foundation/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON schema validator
        run: python -m pip install jsonschema
      - name: Validate JSON data and schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in Path(".").rglob("*.json"):
              if ".git" not in path.parts:
                  json.loads(path.read_text(encoding="utf-8"))

          pairs = {
              "data/provinces.json": "schemas/provinces.schema.json",
              "data/businesses.json": "schemas/businesses.schema.json",
              "data/npc_profiles.json": "schemas/npc_profiles.schema.json"
          }
          for data_path, schema_path in pairs.items():
              data = json.loads(Path(data_path).read_text(encoding="utf-8"))
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              errors = list(Draft202012Validator(schema).iter_errors(data))
              if errors:
                  for error in errors:
                      print(f"{data_path}: {list(error.path)}: {error.message}")
                  raise SystemExit(1)
          print("JSON and schema validation passed.")
          PY
