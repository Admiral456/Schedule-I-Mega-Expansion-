name: Validate project data and domain core

on:
  push:
    branches: ["main", "foundation/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate-project-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON schema validator
        run: python -m pip install jsonschema
      - name: Validate schemas and cross-file references
        run: python scripts/validate_project_data.py

  test-domain-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run domain tests
        run: dotnet test tests/Domain.Core.Tests.csproj --configuration Release
